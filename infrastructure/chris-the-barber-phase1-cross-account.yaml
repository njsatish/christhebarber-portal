AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Phased serverless architecture for christhebarber.denduluru.com.
  Phase 1 creates a private static site behind CloudFront and WAF.
  Phase 2 adds a secure availability API and Setmore secret placeholder.
  Phase 3 adds customer-management, idempotency, verification, queues, and Cognito foundations.

Parameters:
  ProjectName:
    Type: String
    Default: chris-the-barber
    AllowedPattern: '^[a-z0-9-]+$'
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, test, prod]
  DeploymentPhase:
    Type: String
    Default: Phase1
    AllowedValues: [Phase1, Phase2, Phase3]
    Description: Phase1=static handoff, Phase2=live availability, Phase3=management foundation.
  DomainName:
    Type: String
    Default: christhebarber.denduluru.com
  HostedZoneId:
    Type: String
    Default: Z21S238SFANDPM
    Description: DNS zone used only when ManageDnsInStack is true.
  ManageDnsInStack:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  CertificateArn:
    Type: String
    Description: Existing us-east-1 ACM certificate ARN covering DomainName.
  SetmoreServiceKey:
    Type: String
    Default: s5fcf71d64953606227d3e7740166772d785cdf32
    NoEcho: true
  SetmoreStaffKey:
    Type: String
    Default: r99f585095ff06863ec494873de9023fdf26d353f
    NoEcho: true
  SetmoreRefreshToken:
    Type: String
    Default: NOT_CONFIGURED
    NoEcho: true
    Description: Supply only when enabling Phase2 or Phase3. Never commit the real value.
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional operations email. Subscription requires confirmation.
  AllowedOrigin:
    Type: String
    Default: https://christhebarber.denduluru.com
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 120, 180, 365]

Conditions:
  IsPhase2: !Or [!Equals [!Ref DeploymentPhase, Phase2], !Equals [!Ref DeploymentPhase, Phase3]]
  IsPhase3: !Equals [!Ref DeploymentPhase, Phase3]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  ManageDnsHere: !Equals [!Ref ManageDnsInStack, 'true']

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-web-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      BucketVersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 90}
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${Environment}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-${Environment}-security-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://christhebarber.setmore.com"
            Override: true
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          XSSProtection: {Protection: true, ModeBlock: true, Override: true}
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=()'
              Override: true

  EdgeWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-edge-waf'
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-${Environment}-edge-waf'
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSCommonRules
          Priority: 10
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: common-rules, SampledRequestsEnabled: true}
        - Name: AWSKnownBadInputs
          Priority: 20
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: known-bad-inputs, SampledRequestsEnabled: true}
        - Name: EdgeRateLimit
          Priority: 30
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 1000
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: edge-rate-limit, SampledRequestsEnabled: true}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        WebACLId: !GetAtt EdgeWebACL.Arn
        Origins:
          - Id: site-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: site-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0}
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': false}}

  SiteAliasRecord:
    Condition: ManageDnsHere
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  SiteAliasRecordIPv6:
    Condition: ManageDnsHere
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  DeploymentPhase:
    Description: Deployed architecture phase
    Value: Phase1

  SiteBucketName:
    Description: Private S3 website bucket
    Value: !Ref SiteBucket

  CloudFrontDistributionId:
    Description: CloudFront distribution identifier
    Value: !Ref Distribution

  CloudFrontDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt Distribution.DomainName

  WebsiteUrl:
    Description: Public website URL
    Value: !Sub 'https://${DomainName}'
