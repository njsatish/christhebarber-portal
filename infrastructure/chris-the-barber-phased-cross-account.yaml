AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Phased serverless architecture for christhebarber.denduluru.com.
  Phase 1 creates a private static site behind CloudFront and WAF.
  Phase 2 adds a secure availability API and Setmore secret placeholder.
  Phase 3 adds customer-management, idempotency, verification, queues, and Cognito foundations.

Parameters:
  ProjectName:
    Type: String
    Default: chris-the-barber
    AllowedPattern: '^[a-z0-9-]+$'
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, test, prod]
  DeploymentPhase:
    Type: String
    Default: Phase1
    AllowedValues: [Phase1, Phase2, Phase3]
    Description: Phase1=static handoff, Phase2=live availability, Phase3=management foundation.
  DomainName:
    Type: String
    Default: christhebarber.denduluru.com
  HostedZoneId:
    Type: String
    Default: Z21S238SFANDPM
    Description: DNS zone used only when ManageDnsInStack is true.
  ManageDnsInStack:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  CertificateArn:
    Type: String
    Description: Existing us-east-1 ACM certificate ARN covering DomainName.
  SetmoreServiceKey:
    Type: String
    Default: s5fcf71d64953606227d3e7740166772d785cdf32
    NoEcho: true
  SetmoreStaffKey:
    Type: String
    Default: r99f585095ff06863ec494873de9023fdf26d353f
    NoEcho: true
  SetmoreRefreshToken:
    Type: String
    Default: NOT_CONFIGURED
    NoEcho: true
    Description: Supply only when enabling Phase2 or Phase3. Never commit the real value.
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional operations email. Subscription requires confirmation.
  AllowedOrigin:
    Type: String
    Default: https://christhebarber.denduluru.com
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 120, 180, 365]

Conditions:
  IsPhase2: !Or [!Equals [!Ref DeploymentPhase, Phase2], !Equals [!Ref DeploymentPhase, Phase3]]
  IsPhase3: !Equals [!Ref DeploymentPhase, Phase3]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  ManageDnsHere: !Equals [!Ref ManageDnsInStack, 'true']

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-web-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      BucketVersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 90}
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${Environment}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-${Environment}-security-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://christhebarber.setmore.com"
            Override: true
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          XSSProtection: {Protection: true, ModeBlock: true, Override: true}
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=()'
              Override: true

  EdgeWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-edge-waf'
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-${Environment}-edge-waf'
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSCommonRules
          Priority: 10
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: common-rules, SampledRequestsEnabled: true}
        - Name: AWSKnownBadInputs
          Priority: 20
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: known-bad-inputs, SampledRequestsEnabled: true}
        - Name: EdgeRateLimit
          Priority: 30
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 1000
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: edge-rate-limit, SampledRequestsEnabled: true}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        WebACLId: !GetAtt EdgeWebACL.Arn
        Origins:
          - Id: site-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: site-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0}
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': false}}

  SiteAliasRecord:
    Condition: ManageDnsHere
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  SiteAliasRecordIPv6:
    Condition: ManageDnsHere
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  SetmoreSecret:
    Condition: IsPhase2
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${Environment}/${ProjectName}/setmore/oauth'
      Description: Setmore OAuth refresh token. Replace through Secrets Manager after stack creation.
      SecretString: !Sub '{"refreshToken":"${SetmoreRefreshToken}"}'
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}

  ApiLogGroup:
    Condition: IsPhase2
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-availability'
      RetentionInDays: !Ref LogRetentionDays

  AvailabilityRole:
    Condition: IsPhase2
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-availability-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AvailabilityLeastPrivilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${ApiLogGroup.Arn}:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SetmoreSecret

  AvailabilityFunction:
    Condition: IsPhase2
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-availability'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt AvailabilityRole.Arn
      MemorySize: 256
      Timeout: 20
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          SETMORE_SECRET_ARN: !Ref SetmoreSecret
          SETMORE_SERVICE_KEY: !Ref SetmoreServiceKey
          SETMORE_STAFF_KEY: !Ref SetmoreStaffKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          TZ_NAME: America/New_York
      Code:
        ZipFile: |
          const { SecretsManagerClient, GetSecretValueCommand } = require('@aws-sdk/client-secrets-manager');
          const sm = new SecretsManagerClient({});
          let tokenCache = { value: null, expiresAt: 0 };
          const json = (statusCode, body) => ({
            statusCode,
            headers: {
              'content-type': 'application/json',
              'cache-control': 'no-store',
              'access-control-allow-origin': process.env.ALLOWED_ORIGIN,
              'vary': 'origin'
            },
            body: JSON.stringify(body)
          });
          async function accessToken() {
            if (tokenCache.value && tokenCache.expiresAt - Date.now() > 300000) return tokenCache.value;
            const secret = await sm.send(new GetSecretValueCommand({ SecretId: process.env.SETMORE_SECRET_ARN }));
            const refreshToken = JSON.parse(secret.SecretString).refreshToken;
            if (!refreshToken || refreshToken === 'NOT_CONFIGURED') throw new Error('Setmore is not configured');
            const url = new URL('https://developer.setmore.com/api/v1/o/oauth2/token');
            url.searchParams.set('refreshToken', refreshToken);
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            const result = await response.json();
            const token = result?.data?.token;
            if (!response.ok || !result?.response || !token?.access_token) throw new Error('Setmore authentication failed');
            const expires = Number(token.expires_in);
            tokenCache = { value: token.access_token, expiresAt: Date.now() + ((Number.isFinite(expires) && expires > 0 ? expires : 300) * 1000) };
            return tokenCache.value;
          }
          exports.handler = async (event) => {
            try {
              const body = JSON.parse(event.body || '{}');
              if (!/^\d{2}\/\d{2}\/\d{4}$/.test(body.selectedDate || '')) return json(400, { error: 'INVALID_DATE' });
              const token = await accessToken();
              const response = await fetch('https://developer.setmore.com/api/v1/bookingapi/slots', {
                method: 'POST',
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json', accept: 'application/json' },
                body: JSON.stringify({ staff_key: process.env.SETMORE_STAFF_KEY, service_key: process.env.SETMORE_SERVICE_KEY, selected_date: body.selectedDate, off_hours: false, double_booking: false, slot_limit: 30, timezone: 'America/New_York' }),
                signal: AbortSignal.timeout(15000)
              });
              const result = await response.json();
              if (!response.ok || result?.response === false) throw new Error('Setmore availability failed');
              const slots = Array.isArray(result.data) ? result.data : (Array.isArray(result?.data?.slots) ? result.data.slots : []);
              return json(200, { selectedDate: body.selectedDate, timezone: 'America/New_York', slots: slots.filter(x => typeof x === 'string' && /^\d{2}\.\d{2}$/.test(x)) });
            } catch (error) {
              console.error(JSON.stringify({ event: 'availability_error', requestId: event.requestContext?.requestId, message: error.message }));
              return json(502, { error: 'AVAILABILITY_UNAVAILABLE' });
            }
          };

  BookingApi:
    Condition: IsPhase2
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type, x-requested-with]
        MaxAge: 300
      DisableExecuteApiEndpoint: false

  AvailabilityIntegration:
    Condition: IsPhase2
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BookingApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AvailabilityFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 20000

  AvailabilityRoute:
    Condition: IsPhase2
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BookingApi
      RouteKey: 'POST /api/v1/availability'
      Target: !Sub 'integrations/${AvailabilityIntegration}'

  ApiStage:
    Condition: IsPhase2
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref BookingApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiInvokePermission:
    Condition: IsPhase2
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AvailabilityFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${BookingApi}/*/*/api/v1/availability'

  BookingIntentsTable:
    Condition: IsPhase3
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-booking-intents'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: intentId, AttributeType: S}]
      KeySchema: [{AttributeName: intentId, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  IdempotencyTable:
    Condition: IsPhase3
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-idempotency'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: idempotencyKey, AttributeType: S}]
      KeySchema: [{AttributeName: idempotencyKey, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  VerificationTable:
    Condition: IsPhase3
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-verifications'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: verificationId, AttributeType: S}]
      KeySchema: [{AttributeName: verificationId, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  NotificationDLQ:
    Condition: IsPhase3
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-notification-dlq'
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600

  NotificationQueue:
    Condition: IsPhase3
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-notifications'
      KmsMasterKeyId: alias/aws/sqs
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDLQ.Arn
        maxReceiveCount: 5

  AdminUserPool:
    Condition: IsPhase3
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${ProjectName}-${Environment}-admins'
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UserPoolAddOns: {AdvancedSecurityMode: ENFORCED}

  AdminUserPoolClient:
    Condition: IsPhase3
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AdminUserPool
      ClientName: !Sub '${ProjectName}-${Environment}-admin-client'
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${Environment}-alerts'
      KmsMasterKeyId: alias/aws/sns

  AlertSubscription:
    Condition: HasAlertEmail
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  AvailabilityErrorAlarm:
    Condition: IsPhase2
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-availability-errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref AvailabilityFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  DeploymentPhase:
    Value: !Ref DeploymentPhase
  SiteBucketName:
    Value: !Ref SiteBucket
  CloudFrontDistributionId:
    Value: !Ref Distribution
  WebsiteUrl:
    Value: !Sub 'https://${DomainName}'
  ApiEndpoint:
    Condition: IsPhase2
    Value: !GetAtt BookingApi.ApiEndpoint
  AvailabilityEndpoint:
    Condition: IsPhase2
    Value: !Sub '${BookingApi.ApiEndpoint}/api/v1/availability'
  SetmoreSecretArn:
    Condition: IsPhase2
    Value: !Ref SetmoreSecret
  BookingIntentsTableName:
    Condition: IsPhase3
    Value: !Ref BookingIntentsTable
  AdminUserPoolId:
    Condition: IsPhase3
    Value: !Ref AdminUserPool
