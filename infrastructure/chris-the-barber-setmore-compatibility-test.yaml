AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Private read-only Lambda compatibility test for Chris the Barber Setmore
  availability. No API Gateway, Lambda URL, secrets, customer data, or booking mutations.

Parameters:
  ProjectName:
    Type: String
    Default: chris-the-barber
    AllowedPattern: '^[a-z0-9-]+$'
  Environment:
    Type: String
    Default: test
    AllowedValues:
      - dev
      - test
      - prod
  ArtifactBucket:
    Type: String
    MinLength: 3
  ArtifactKey:
    Type: String
    MinLength: 1
  CodeSha256:
    Type: String
    Description: Deployment package SHA-256 used to force code updates.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 7
      - 14
      - 30
      - 60
      - 90
Resources:
  CompatibilityLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-setmore-compatibility-test'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: NoCustomerData

  CompatibilityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-setmore-compatibility-role'
      Description: Least-privilege role for read-only Setmore compatibility testing.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: WriteOnlyOwnCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${CompatibilityLogGroup.Arn}:*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CompatibilityFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - CompatibilityLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-setmore-compatibility-test'
      Description: Read-only compatibility test for Setmore GetSlots. No booking mutations.
      Architectures:
        - arm64
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 256
      Timeout: 20
      Role: !GetAtt CompatibilityRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          CODE_SHA256: !Ref CodeSha256
          COMPATIBILITY_MODE: READ_ONLY_TEST
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      TracingConfig:
        Mode: PassThrough
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: SetmoreReadOnlyCompatibilityTest
        - Key: PublicAccess
          Value: None

Outputs:
  FunctionName:
    Description: Private Lambda function name.
    Value: !Ref CompatibilityFunction
  FunctionArn:
    Description: Private Lambda function ARN.
    Value: !GetAtt CompatibilityFunction.Arn
  LogGroupName:
    Description: CloudWatch log group.
    Value: !Ref CompatibilityLogGroup
  ArtifactLocation:
    Description: Lambda deployment artifact location.
    Value: !Sub 's3://${ArtifactBucket}/${ArtifactKey}'
  PublicEndpoint:
    Description: This stack intentionally creates no public endpoint.
    Value: NONE
